server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Send the bare root to the app's base path
    location = / {
        return 302 /rhythm-finder/;
    }

    # Static export emits about.html (or about/index.html with trailingSlash)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /rhythm-finder/404.html;

    # Next.js hashed assets are safe to cache long-term
    location /rhythm-finder/_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}